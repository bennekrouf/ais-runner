name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      # ── Build ais-runner ─────────────────────────────────────────────────
      - name: Build ais-runner
        run: cargo build --release

      - name: Copy WebView2Loader.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem "target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll" | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "target\release\WebView2Loader.dll" -Force }
          else { Write-Error "WebView2Loader.dll not found in build output" }

      # ── Graphical installer ──────────────────────────────────────────────
      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found" }
          $version = (Select-String 'version = "(.+)"' Cargo.toml).Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $iscc /DMyAppVersion=$version installer\installer.iss
          Write-Host "Installer: dist\ais-runner-setup.exe ($([math]::Round((Get-Item dist\ais-runner-setup.exe).Length/1MB,1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-runner-windows
          path: dist\ais-runner-setup.exe
          retention-days: 30
