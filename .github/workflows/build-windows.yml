name: Build Windows

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: windows-cargo-${{ hashFiles('Cargo.lock') }}

      # ── Build ais-runner ─────────────────────────────────────────────────
      - name: Build ais-runner
        run: cargo build --release

      # ── Package: exe + setup script only ────────────────────────────────
      - name: Write README
        shell: pwsh
        run: |
          $readme = @(
            "AIS Runner for Windows",
            "======================",
            "",
            "FIRST TIME SETUP",
            "----------------",
            "1. Extract this ZIP anywhere.",
            "2. Right-click setup-windows.ps1 and choose Run with PowerShell (needs internet + admin)",
            "   Installs: Node.js 20.18.1, Azure CLI 2.65.0, Azurite 3.30.0, func 4.x",
            "   Run once - already-installed tools are skipped automatically.",
            "",
            "LAUNCH",
            "------",
            "3. Run ais-runner.exe.",
            "",
            "DEPENDENCIES (installed by setup script, not bundled)",
            "------------------------------------------------------",
            "  Node.js    v20.18.1  https://nodejs.org",
            "  Azure CLI  2.65.0    https://aka.ms/installazurecliwindows",
            "  Azurite    3.30.0    npm install -g azurite@3.30.0",
            "  func       4.x       npm install -g azure-functions-core-tools@4"
          )
          $readme | Out-File "README.txt" -Encoding UTF8

      - name: Package ZIP
        shell: pwsh
        run: |
          $dist = "dist\ais-runner-windows"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          Copy-Item "target\release\ais-runner.exe" $dist\
          Copy-Item "scripts\setup-windows.ps1"     $dist\
          Copy-Item "README.txt"                     $dist\

          Compress-Archive -Path "$dist\*" -DestinationPath "ais-runner-windows.zip" -Force

          $size = (Get-Item ais-runner-windows.zip).Length / 1MB
          Write-Host "Package ready: ais-runner-windows.zip ($([math]::Round($size,1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-runner-windows
          path: ais-runner-windows.zip
          retention-days: 30
