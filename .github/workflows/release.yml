name: Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build-mac:
    runs-on: macos-latest  # arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package
        run: |
          DIST=dist/ais-runner-macos-arm64
          mkdir -p "$DIST"
          cp target/aarch64-apple-darwin/release/ais-runner "$DIST/"
          cp scripts/setup-mac.sh "$DIST/"
          cp README.md "$DIST/"
          tar -czf ais-runner-macos-arm64.tar.gz -C dist ais-runner-macos-arm64
          shasum -a 256 ais-runner-macos-arm64.tar.gz > ais-runner-macos-arm64.tar.gz.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-runner-macos-arm64
          path: |
            ais-runner-macos-arm64.tar.gz
            ais-runner-macos-arm64.tar.gz.sha256

  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: release-windows-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release

      - name: Copy WebView2Loader.dll
        shell: pwsh
        run: |
          $dll = Get-ChildItem "target\release\build\webview2-com-sys-*\out\x64\WebView2Loader.dll" | Select-Object -First 1
          if ($dll) { Copy-Item $dll.FullName "target\release\WebView2Loader.dll" -Force }
          else { Write-Error "WebView2Loader.dll not found in build output" }

      - name: Install Inno Setup
        run: choco install innosetup -y --no-progress

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = @(
            "C:\Program Files (x86)\Inno Setup 6\ISCC.exe",
            "$env:LOCALAPPDATA\Programs\Inno Setup 6\ISCC.exe"
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) { Write-Error "ISCC.exe not found" }
          $version = "${{ github.ref_name }}".TrimStart("v")
          New-Item -ItemType Directory -Path dist -Force | Out-Null
          & $iscc /DMyAppVersion=$version installer\installer.iss
          $hash = (Get-FileHash dist\ais-runner-setup.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  ais-runner-setup.exe" | Out-File "dist\ais-runner-setup.exe.sha256" -Encoding ASCII
          Write-Host "Installer: dist\ais-runner-setup.exe ($([math]::Round((Get-Item dist\ais-runner-setup.exe).Length/1MB,1)) MB)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-runner-windows
          path: |
            dist\ais-runner-setup.exe
            dist\ais-runner-setup.exe.sha256

  update-tap:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest

    steps:
      - name: Download Mac artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Compute sha256
        id: sha
        run: |
          ARM64=$(cat artifacts/ais-runner-macos-arm64/ais-runner-macos-arm64.tar.gz.sha256 | awk '{print $1}')
          echo "arm64=$ARM64" >> "$GITHUB_OUTPUT"

      - name: Check out homebrew tap
        uses: actions/checkout@v4
        with:
          repository: Bennekrouf/homebrew-aisrunner
          token: ${{ secrets.TAP_GITHUB_TOKEN }}
          path: tap

      - name: Update formula
        env:
          VERSION: ${{ github.ref_name }}
          SHA_ARM64: ${{ steps.sha.outputs.arm64 }}
        run: |
          FORMULA=tap/Formula/aisrunner.rb
          VER="${VERSION#v}"

          sed -i "s|version \".*\"|version \"$VER\"|" "$FORMULA"
          sed -i "s|sha256 \".*\"|sha256 \"$SHA_ARM64\"|" "$FORMULA"

      - name: Commit and push
        working-directory: tap
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/aisrunner.rb
          git commit -m "aisrunner ${{ github.ref_name }}"
          git push

  release:
    needs: [build-mac, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ github.ref_name }}"

          # Collect all release files
          FILES=$(find artifacts -type f | tr '\n' ' ')

          gh release create "$TAG" \
            --title "ais-runner $TAG" \
            --notes "$(cat <<'EOF'
          ## Installation

          ### macOS (Apple Silicon)
          ```bash
          brew tap Bennekrouf/aisrunner
          brew install aisrunner
          ```

          Or manually:
          ```bash
          curl -L https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/ais-runner-macos-arm64.tar.gz | tar xz
          cd ais-runner-macos-arm64
          ./setup-mac.sh
          ./ais-runner
          ```

          ### Windows
          Download `ais-runner-setup.exe` and run it — the installer handles everything (app + optional dependencies).
          EOF
          )" \
            $FILES
