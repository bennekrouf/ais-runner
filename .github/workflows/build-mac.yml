name: Build macOS

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest  # arm64 (Apple Silicon)

    steps:
      - uses: actions/checkout@v4

      - name: Checkout ais-chain (path dependency)
        uses: actions/checkout@v4
        with:
          repository: Bennekrouf/ais-chain
          path: ../ais-chain

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: macos-arm64-cargo-${{ hashFiles('Cargo.lock') }}

      - name: Build
        run: cargo build --release --target aarch64-apple-darwin

      - name: Package tar.gz
        run: |
          DIST=dist/ais-runner-macos-arm64
          mkdir -p "$DIST"
          cp target/aarch64-apple-darwin/release/ais-runner "$DIST/"
          cp scripts/setup-mac.sh "$DIST/"
          cp README.md "$DIST/"
          tar -czf ais-runner-macos-arm64.tar.gz -C dist ais-runner-macos-arm64
          echo "sha256: $(shasum -a 256 ais-runner-macos-arm64.tar.gz)"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ais-runner-macos-arm64
          path: ais-runner-macos-arm64.tar.gz
          retention-days: 30
