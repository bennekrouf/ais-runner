name: Copy secrets to another repo

# Copies this repository's release secrets (signing, notarization, publish) to
# another repository of the same owner, so a new app reuses the same Apple,
# Azure and mayorana.ch credentials without anyone re-entering them.
#
# GitHub secrets are write-only: nobody can read them back, only a workflow
# run can use them. This run reads them from its own environment and writes
# them into the target with `gh secret set`. The values never leave GitHub and
# never appear in the log (Actions masks every secret).
#
# Inert until SECRETS_COPY_TOKEN exists: a fine-grained personal access token
# limited to the target repository, with "Secrets: Read and write". Create it
# for the copy, run this, then delete the token (Settings → Developer settings
# → Fine-grained tokens) and the SECRETS_COPY_TOKEN secret.
#
# Run: gh workflow run copy-secrets.yml -f target=bennekrouf/<repo>

on:
  workflow_dispatch:
    inputs:
      target:
        description: 'Repository to copy the secrets into (owner/name)'
        required: true
        default: 'bennekrouf/spreadwatch'

permissions:
  contents: read

jobs:
  copy:
    # Only the owner can start it, and only from the default branch.
    if: github.actor == github.repository_owner && github.ref_name == github.event.repository.default_branch
    runs-on: ubuntu-latest
    env:
      TARGET: ${{ inputs.target }}
      GH_TOKEN: ${{ secrets.SECRETS_COPY_TOKEN }}
      # The release secrets, by name. TAP_GITHUB_TOKEN (Homebrew) and the copy
      # token itself are deliberately not copied.
      MACOS_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE }}
      MACOS_CERTIFICATE_PWD: ${{ secrets.MACOS_CERTIFICATE_PWD }}
      MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      APP_STORE_CONNECT_KEY: ${{ secrets.APP_STORE_CONNECT_KEY }}
      APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
      APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
      AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
      AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
      AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
      TRUSTED_SIGNING_ENDPOINT: ${{ secrets.TRUSTED_SIGNING_ENDPOINT }}
      TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
      TRUSTED_SIGNING_CERT_PROFILE: ${{ secrets.TRUSTED_SIGNING_CERT_PROFILE }}
      DIST_SSH_KEY: ${{ secrets.DIST_SSH_KEY }}
      DIST_SSH_HOST: ${{ secrets.DIST_SSH_HOST }}
      DIST_SSH_USER: ${{ secrets.DIST_SSH_USER }}
      DIST_SSH_KNOWN_HOSTS: ${{ secrets.DIST_SSH_KNOWN_HOSTS }}
    steps:
      - name: Check target and token
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error::SECRETS_COPY_TOKEN is not set. Create a fine-grained token for $TARGET with 'Secrets: Read and write', then: gh secret set SECRETS_COPY_TOKEN -R $GITHUB_REPOSITORY"
            exit 1
          fi
          # Same owner only, and never back into this repository: the input is
          # free text, and a typo must not send signing keys somewhere else.
          if [[ "${TARGET,,}" != "${GITHUB_REPOSITORY_OWNER,,}/"* ]]; then
            echo "::error::Target '$TARGET' is not owned by $GITHUB_REPOSITORY_OWNER — refusing."
            exit 1
          fi
          if [[ "${TARGET,,}" == "${GITHUB_REPOSITORY,,}" ]]; then
            echo "::error::Target is this repository — nothing to copy."
            exit 1
          fi
          gh repo view "$TARGET" --json name > /dev/null

      - name: Copy secrets
        run: |
          set -euo pipefail
          names=(
            MACOS_CERTIFICATE MACOS_CERTIFICATE_PWD MACOS_SIGNING_IDENTITY KEYCHAIN_PASSWORD
            APP_STORE_CONNECT_KEY APP_STORE_CONNECT_KEY_ID APP_STORE_CONNECT_ISSUER_ID
            AZURE_TENANT_ID AZURE_CLIENT_ID AZURE_CLIENT_SECRET
            TRUSTED_SIGNING_ENDPOINT TRUSTED_SIGNING_ACCOUNT TRUSTED_SIGNING_CERT_PROFILE
            DIST_SSH_KEY DIST_SSH_HOST DIST_SSH_USER DIST_SSH_KNOWN_HOSTS
          )
          copied=0; missing=()
          for name in "${names[@]}"; do
            value="${!name:-}"
            if [ -z "$value" ]; then
              missing+=("$name")
              continue
            fi
            # Through stdin, not an argument: multi-line values (the SSH key,
            # known_hosts) arrive intact and nothing shows in the process list.
            printf '%s' "$value" | gh secret set "$name" --repo "$TARGET"
            echo "copied $name"
            copied=$((copied + 1))
          done
          echo "Copied $copied of ${#names[@]} secrets to $TARGET."
          if [ ${#missing[@]} -gt 0 ]; then
            echo "::warning::Not set in $GITHUB_REPOSITORY, so not copied: ${missing[*]}"
          fi

      - name: List secrets now in the target
        run: gh secret list --repo "$TARGET"
