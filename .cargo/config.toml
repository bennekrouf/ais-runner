[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"

# Link the MSVC C runtime statically on Windows. With the default dynamic CRT, ais-runner.exe and ais-mcp.exe
# import VCRUNTIME140.dll / VCRUNTIME140_1.dll and fail to start on any PC without the Visual
# C++ Redistributable. The installer is per-user with no UAC prompt, so it can't install the
# redistributable itself.
# The cc crate follows this flag, so C dependencies build with /MT too.
# Release CI checks the result with scripts/check-windows-crt.ps1.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
