# The Rust version for every build of AIS Runner: local, CI and releases. rustup
# installs it on first use.
#
# A number, not `stable`. Floating on stable is what broke the Windows release
# when Rust 1.100 came out: the build ran on a compiler nobody had tried, and
# the step that picks WebView2Loader.dll out of the build output found nothing.
# Each stable release also brings new clippy lints, which CI denies.
#
# The same version as every mayorana desktop app, and as the
# dtolnay/rust-toolchain@1.99 steps in .github/workflows. Bump them together,
# on purpose, and fix whatever the new compiler and clippy report in the same
# change. Cross-target builds pass --target explicitly, so the targets are not
# listed here.
[toolchain]
channel = "1.99"
components = ["rustfmt", "clippy"]
