[package]
name = "ais-runner"
version = "0.5.1"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
dirs = "5"
indexmap = "2"
regex = { version = "1.12.3", features = ["std"] }
dark-light = "1"
arboard = "3"
hmac        = "0.12"
sha2        = "0.10"
base64      = "0.22"
fe2o3-amqp       = "0.14"
fe2o3-amqp-types = "0.14"
liquid      = "0.26"
liquid-core = "0.26"
tiberius    = { version = "0.12", default-features = false, features = ["rustls", "sql-browser-tokio", "chrono"] }
uuid        = { version = "1", features = ["v4"] }
tokio-util  = { version = "0.7", features = ["compat"] }
ais-chain   = { git = "https://github.com/Bennekrouf/ais-chain" }
axum        = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tower       = "0.5"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Skipped on non-Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
bundle-azurite = []
