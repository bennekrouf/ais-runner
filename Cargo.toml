# The runner stays the root package; ais-core is a member alongside it, so the
# release pipeline, installer and Homebrew formula all still build from here.
[workspace]
members = ["crates/ais-core"]
resolver = "2"

[package]
name = "ais-runner"
version = "0.5.66"
edition = "2021"
# Source-available, not OSI open source. Free for noncommercial use;
# commercial use needs a licence. See LICENSE and TRADEMARK.md.
license-file = "LICENSE"
# The crate ships three binaries — the GUI, the headless `ais-test` scenario
# runner and the `ais-mcp` server. Without this, `cargo run` is ambiguous and
# errors out.
default-run = "ais-runner"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
dirs = "5"
indexmap = "2"
regex = { version = "1.12.3", features = ["std"] }
dark-light = "1"
arboard = "3"
hmac        = "0.12"
sha2        = "0.10"
base64      = "0.22"
fe2o3-amqp       = "0.14"
fe2o3-amqp-types = "0.14"
liquid      = "0.26"
liquid-core = "0.26"
tiberius    = { version = "0.12", default-features = false, features = ["rustls", "sql-browser-tokio", "chrono"] }
uuid        = { version = "1", features = ["v4"] }
tokio-util  = { version = "0.7", features = ["compat"] }
ais-chain   = { git = "https://github.com/Bennekrouf/ais-chain" }
axum        = { version = "0.8", default-features = false, features = ["http1", "json", "tokio", "matched-path"] }
tower       = "0.5"
notify-rust = "4"
ais-core    = { path = "crates/ais-core" }
# The `ais-mcp` binary: an MCP server over stdio, so Claude and other MCP
# clients can read a project's workflows, runs and builds.
rmcp        = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
schemars    = "1"

# Signal handling on exit paths that never unwind — see services::signals.
# The anonymous install id for usage statistics: 128 random bits. Already
# in the tree via other crates, so this names a dependency rather than adding one.
getrandom = "0.3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

# Embed the app icon (assets/icon.ico) into the Windows .exe resource so the
# taskbar, Start menu, alt-tab, and installer shortcuts all show the logo.
# Skipped on non-Windows hosts.
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"

[dev-dependencies]
tempfile = "3"

[features]
default = []
bundle-azurite = []

# ── Debug build size ─────────────────────────────────────────────────────────
# `rsx!` expands into deeply nested generic component trees, so with the stock
# `debug = true` the DWARF hung off every instantiation grew
# libais_runner.rlib to 379 MB — nearly 5× the largest dependency — out of
# 2.5 MB of source. One clean `cargo build` cost 3.8 GB, 4.7 GB with
# `--all-targets`. Cargo never garbage-collects target/, so every Cargo.lock
# change and every toolchain left a further generation behind and this
# checkout reached 300 GB.
#
# Line tables for our own crates keep file:line in panic backtraces, which is
# the part we actually read; the 364 dependencies get no debuginfo at all.
# Measured on a clean build: 3.8 GB -> 2.6 GB, rlib 379 MB -> 241 MB. Use
# `debug = 2` here temporarily when you need a real debugger over dependency
# frames.
#
# rust-toolchain.toml keeps new toolchain generations from appearing. To drop
# the ones already on disk, run `cargo sweep --time 15`; `--installed` only
# reclaims anything once an old toolchain has actually been uninstalled.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false
