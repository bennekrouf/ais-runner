[package]
name = "ais-runner"
version = "0.3.25"
edition = "2021"

[dependencies]
dioxus = { version = "0.6", features = ["desktop"] }
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json", "blocking"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = "0.3"
chrono = { version = "0.4", features = ["serde"] }
rfd = "0.15"
dirs = "5"
indexmap = "2"
regex = { version = "1.12.3", features = ["std"] }
dark-light = "1"
arboard = "3"
hmac        = "0.12"
sha2        = "0.10"
base64      = "0.22"
fe2o3-amqp       = "0.14"
fe2o3-amqp-types = "0.14"
liquid      = "0.26"
liquid-core = "0.26"
ais-chain   = { git = "https://github.com/Bennekrouf/ais-chain" }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging"] }

[features]
default = []
bundle-azurite = []
